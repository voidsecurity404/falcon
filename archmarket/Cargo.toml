[package]
name = "archmarket"
version = "1.0.0"
edition = "2024"
description = "Graphical package store for Arch Linux: pacman and AUR (yay)"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.37"
jxl-oxide = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
flate2 = "1"
ruzstd = "0.9"
tar = "0.4"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
