<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Falcon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="stylesheet" href="app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="glow"></div>

<header id="top">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 5h18v12H3Z M9 21h6 M12 17v4"/></svg></div>
    <div>
      <div id="host" class="host">…</div>
      <div id="sub" class="sub"><span class="dot"></span><span id="subText"></span></div>
    </div>
  </div>
  <button id="shotTop" class="round" aria-label="Screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3.5L9.5 5h5l2 3H20v11H4Z M8.8 13a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0-6.4 0Z"/></svg></button>
</header>

<main>
  <!-- Dashboard -->
  <section id="tab-dash" class="tab active">
    <div class="card hero">
      <canvas id="cpuChart" class="heroChart"></canvas>
      <div class="gauges">
        <div class="gauge" id="gCpu"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" cx="50" cy="50" r="42"/></svg><div class="gv"><b>0</b><span>%</span></div><div class="gl" data-t="Processor"></div></div>
        <div class="gauge" id="gMem"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" cx="50" cy="50" r="42"/></svg><div class="gv"><b>0</b><span>%</span></div><div class="gl" data-t="Memory"></div></div>
        <div class="gauge" id="gTemp"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" cx="50" cy="50" r="42"/></svg><div class="gv"><b>0</b><span>°C</span></div><div class="gl" data-t="Temperature"></div></div>
      </div>
      <div class="heroFoot">
        <span id="cpuModel" class="mono dim"></span>
        <span id="cpuFreq" class="mono"></span>
      </div>
    </div>

    <div class="card">
      <div class="cardHead"><span data-t="Cores"></span><span id="loadAvg" class="mono dim"></span></div>
      <div id="cores" class="cores"></div>
    </div>

    <div class="grid2">
      <div class="card stat">
        <div class="cardHead"><span data-t="Network"></span><span id="netIface" class="mono dim"></span></div>
        <canvas id="netChart" class="mini"></canvas>
        <div class="netRow"><span class="down">↓ <b id="rx">0</b></span><span class="up">↑ <b id="tx">0</b></span></div>
      </div>
      <div class="card stat">
        <div class="cardHead"><span data-t="Memory"></span><span id="memText" class="mono dim"></span></div>
        <canvas id="memChart" class="mini"></canvas>
        <div class="memBar"><i id="memUsed"></i><i id="memCache"></i></div>
        <div class="netRow small"><span><span data-t="Swap"></span> <b id="swap">0</b></span><span><span data-t="Disk"></span> <b id="diskIO">0</b></span></div>
      </div>
    </div>

    <div class="card">
      <div class="cardHead"><span data-t="Disks"></span></div>
      <div id="disks"></div>
    </div>

    <div class="chips" id="chips"></div>

    <div class="card" id="mediaCard">
      <div class="cardHead"><span data-t="Sound and music"></span><span id="volText" class="mono dim"></span></div>
      <div class="media">
        <div class="mediaText"><div id="mTitle" class="ell"></div><div id="mArtist" class="ell dim"></div></div>
        <div class="mediaBtns">
          <button class="ic" data-act="previous"><svg viewBox="0 0 24 24"><path d="M18 6v12L9 12Z M6 6v12"/></svg></button>
          <button class="ic big" data-act="playPause"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5v14l12-7Z"/></svg></button>
          <button class="ic" data-act="next"><svg viewBox="0 0 24 24"><path d="M6 6v12l9-6Z M18 6v12"/></svg></button>
        </div>
      </div>
      <div class="volRow">
        <button class="ic" data-act="mute"><svg viewBox="0 0 24 24" id="muteIcon"><path d="M4 9.5V14.5H7.6L12 18.5V5.5L7.6 9.5H4Z M16 9.5L21 14.5 M21 9.5L16 14.5"/></svg></button>
        <div class="volBar"><i id="volFill"></i></div>
        <button class="ic" data-act="volumeDown"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="ic" data-act="volumeUp"><svg viewBox="0 0 24 24"><path d="M6 12h12 M12 6v12"/></svg></button>
      </div>
    </div>

    <div class="card">
      <div class="cardHead"><span data-t="Session"></span></div>
      <div class="power">
        <button data-act="lock"><svg viewBox="0 0 24 24"><path d="M6 11h12v9H6Z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg><span data-t="Lock"></span></button>
        <button data-act="suspend" class="needsPower"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><span data-t="Sleep"></span></button>
        <button data-act="reboot" class="needsPower"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6 M20 4v5h-5"/></svg><span data-t="Reboot"></span></button>
        <button data-act="poweroff" class="needsPower danger"><svg viewBox="0 0 24 24"><path d="M12 3v8 M6.5 6.5a8 8 0 1 0 11 0"/></svg><span data-t="Shut down"></span></button>
      </div>
    </div>
  </section>

  <!-- Terminal -->
  <section id="tab-term" class="tab">
    <div class="termBar">
      <span id="termBadge" class="badge"></span>
      <span class="grow"></span>
      <button id="termFont" class="pill">A±</button>
      <button id="termNew" class="pill" data-t="New session"></button>
    </div>
    <div id="termBox"><div id="term"></div></div>
    <div id="keys" class="keys">
      <button data-k="esc">Esc</button><button data-k="tab">Tab</button><button data-k="ctrl" class="mod">Ctrl</button><button data-k="alt" class="mod">Alt</button>
      <button data-k="up">↑</button><button data-k="down">↓</button><button data-k="left">←</button><button data-k="right">→</button>
      <button data-k="^C">^C</button><button data-k="^D">^D</button><button data-k="^L">^L</button><button data-k="^R">^R</button>
      <button data-k="|">|</button><button data-k="~">~</button><button data-k="/">/</button><button data-k="-">-</button>
      <button data-k="home">Home</button><button data-k="end">End</button><button data-k="pgup">PgUp</button><button data-k="pgdn">PgDn</button>
    </div>
  </section>

  <!-- Screen -->
  <section id="tab-screen" class="tab">
    <button class="card wide" id="wholeScreen">
      <div class="wideIcon"><svg viewBox="0 0 24 24"><path d="M3 5h18v12H3Z M9 21h6 M12 17v4"/></svg></div>
      <div class="grow"><div class="b" data-t="Whole screen"></div><div class="dim small" data-t="What is on the display right now"></div></div>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div id="windows"></div>
  </section>

  <!-- Processes -->
  <section id="tab-procs" class="tab">
    <div class="procHead">
      <div class="search"><svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14Z M16 16l5 5"/></svg><input id="procQ" type="search" autocomplete="off" spellcheck="false"></div>
      <div class="sorts" id="sorts">
        <button data-s="cpu" class="on">CPU</button><button data-s="mem" data-t="RAM"></button><button data-s="age" data-t="Time"></button><button data-s="name" data-t="Name"></button><button data-s="pid">PID</button>
        <button id="mineOnly" class="toggle" data-t="Mine"></button>
      </div>
      <div class="procSummary" id="procSummary"></div>
    </div>
    <div id="procs"></div>
  </section>

  <!-- Clipboard -->
  <section id="tab-clip" class="tab">
    <div class="card">
      <div class="cardHead"><span data-t="Send to the computer"></span></div>
      <textarea id="clipText" rows="5"></textarea>
      <div class="row gap">
        <button id="clipSend" class="primary grow"><svg viewBox="0 0 24 24"><path d="M21 3L3 10.5L10 13L13 20Z M10 13L21 3"/></svg><span data-t="Copy on the computer"></span></button>
        <label class="secondary" id="clipImgLabel"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4Z M4 16l5-5 4 4 3-3 4 4 M15.5 8.5h.01"/></svg><input type="file" id="clipImg" accept="image/*" hidden></label>
      </div>
      <div class="hint" data-t="It lands on the computer's clipboard, as if you pressed Ctrl+C there. You can also just write to the bot in the chat."></div>
    </div>
    <div class="card">
      <div class="cardHead"><span data-t="On the computer's clipboard"></span><button id="clipRefresh" class="ic sm"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6 M20 4v5h-5"/></svg></button></div>
      <pre id="pcClip" class="pcClip"></pre>
      <img id="pcClipImg" class="pcClipImg" alt="">
      <button id="clipToPhone" class="secondary full"><svg viewBox="0 0 24 24"><path d="M9 9h11v11H9Z M5 15H4V4h11v1"/></svg><span data-t="Copy to the phone"></span></button>
    </div>
    <div class="card" id="sentCard">
      <div class="cardHead"><span data-t="Sent recently"></span></div>
      <div id="sent"></div>
    </div>
  </section>
</main>

<nav id="nav">
  <button data-tab="dash" class="on"><svg viewBox="0 0 24 24"><path d="M4 4h7v9H4Z M13 4h7v5h-7Z M13 11h7v9h-7Z M4 15h7v5H4Z"/></svg><span data-t="Overview"></span></button>
  <button data-tab="term"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3Z M7 9l3 3l-3 3 M12.5 15H17"/></svg><span data-t="Terminal"></span></button>
  <button data-tab="screen"><svg viewBox="0 0 24 24"><path d="M4 5h7v14H4Z M14 5h6v6h-6Z M14 14h6v5h-6Z"/></svg><span data-t="Screen"></span></button>
  <button data-tab="procs"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span data-t="Processes"></span></button>
  <button data-tab="clip"><svg viewBox="0 0 24 24"><path d="M8 4h8v3H8Z M16 5h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h2 M9 12h6 M9 16h4"/></svg><span data-t="Clipboard"></span></button>
</nav>

<!-- Picture viewer -->
<div id="viewer" class="sheet">
  <div class="sheetBody">
    <div class="sheetHead">
      <img id="vIcon" class="appIcon" alt="">
      <div class="grow ell"><div id="vTitle" class="b ell"></div><div id="vSub" class="dim small ell"></div></div>
      <button class="ic" id="vClose"><svg viewBox="0 0 24 24"><path d="M6 6L18 18 M18 6L6 18"/></svg></button>
    </div>
    <div class="shot" id="vShot"><img id="vImg" alt=""><div class="spinner" id="vSpin"></div><div id="vErr" class="err"></div></div>
    <div class="sheetBtns">
      <button id="vRefresh" class="secondary"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6 M20 4v5h-5"/></svg><span data-t="Again"></span></button>
      <button id="vLive" class="secondary"><span class="liveDot"></span><span data-t="Live"></span></button>
      <button id="vFocus" class="secondary"><svg viewBox="0 0 24 24"><path d="M4 8V4h4 M16 4h4v4 M20 16v4h-4 M8 20H4v-4"/></svg><span data-t="Bring forward"></span></button>
      <button id="vKill" class="secondary danger"><svg viewBox="0 0 24 24"><path d="M6 6L18 18 M18 6L6 18"/></svg><span data-t="Close"></span></button>
    </div>
  </div>
</div>

<!-- Process details -->
<div id="procSheet" class="sheet">
  <div class="sheetBody">
    <div class="sheetHead">
      <div class="grow ell"><div id="pName" class="b ell"></div><div id="pSub" class="dim small mono ell"></div></div>
      <button class="ic" id="pClose"><svg viewBox="0 0 24 24"><path d="M6 6L18 18 M18 6L6 18"/></svg></button>
    </div>
    <pre id="pCmd" class="pcClip"></pre>
    <div id="pStats" class="pStats"></div>
    <div class="sheetBtns">
      <button data-sig="STOP" class="secondary" data-t="Pause"></button>
      <button data-sig="CONT" class="secondary" data-t="Resume"></button>
      <button data-sig="TERM" class="secondary danger" data-t="End"></button>
      <button data-sig="KILL" class="secondary danger" data-t="Kill"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<div id="gate" class="gate">
  <div class="gateCard">
    <div class="logo big"><svg viewBox="0 0 24 24"><path d="M6 11h12v9H6Z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg></div>
    <div id="gateText" class="b"></div>
    <div id="gateSub" class="dim small"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
