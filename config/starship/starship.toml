# Starship — Nord Pills (5-variant)
# Nerd Font glyphs are written as \uXXXX escapes so they survive editing.
#    = left round cap    = right round cap
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[](fg:#88c0d0)$os$username[](fg:#88c0d0) \
[](fg:#81a1c1)$directory[](fg:#81a1c1)\
$git_branch$git_status\
$rust$python$nodejs\
$cmd_duration \
[](fg:#b48ead)$time[](fg:#b48ead)
$character"""

[os]
disabled = false
style = "bold fg:#2e3440 bg:#88c0d0"
format = "[$symbol ]($style)"

[os.symbols]
Arch = ""
CachyOS = ""
Linux = ""

[username]
show_always = true
style_user = "bold fg:#2e3440 bg:#88c0d0"
style_root = "bold fg:#bf616a bg:#88c0d0"
format = "[$user]($style)"

[directory]
style = "bold fg:#2e3440 bg:#81a1c1"
format = "[ $path]($style)[$read_only]($read_only_style)"
read_only = " "
read_only_style = "fg:#bf616a bg:#81a1c1"
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
symbol = ""
style = "bold fg:#2e3440 bg:#a3be8c"
format = " [](fg:#a3be8c)[$symbol $branch]($style)"

[git_status]
style = "bold fg:#2e3440 bg:#a3be8c"
format = "[( $all_status$ahead_behind)]($style)[](fg:#a3be8c)"

[rust]
symbol = ""
style = "bold fg:#2e3440 bg:#ebcb8b"
format = " [](fg:#ebcb8b)[$symbol $version]($style)[](fg:#ebcb8b)"

[python]
symbol = ""
style = "bold fg:#2e3440 bg:#ebcb8b"
format = " [](fg:#ebcb8b)[$symbol $version]($style)[](fg:#ebcb8b)"

[nodejs]
symbol = ""
style = "bold fg:#2e3440 bg:#ebcb8b"
format = " [](fg:#ebcb8b)[$symbol $version]($style)[](fg:#ebcb8b)"

[cmd_duration]
min_time = 2000
style = "bold fg:#2e3440 bg:#d08770"
format = " [](fg:#d08770)[ $duration]($style)[](fg:#d08770)"

[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:#2e3440 bg:#b48ead"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold #88c0d0)"
error_symbol = "[❯](bold #bf616a)"
vimcmd_symbol = "[❮](bold #a3be8c)"
