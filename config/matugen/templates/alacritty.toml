# Generated by matugen from the wallpaper, do not edit by hand.
# The same palette as kitty (templates/kitty.conf).
<* if {{ is_dark_mode }} *>
[colors.primary]
foreground = "{{colors.primary_fixed.default.hex}}"
background = "{{colors.on_primary_fixed.default.hex}}"
<* else *>
[colors.primary]
foreground = "{{colors.on_primary_fixed.default.hex}}"
background = "{{colors.primary_fixed.default.hex}}"
<* endif *>

[colors.cursor]
cursor = "{{colors.primary.default.hex}}"
text = "{{colors.on_primary.default.hex}}"

[colors.selection]
foreground = "{{colors.on_primary.default.hex}}"
background = "{{colors.primary.default.hex}}"

[colors.normal]
red = "{{colors.term_red.default.hex}}"
green = "{{colors.term_green.default.hex}}"
yellow = "{{colors.term_yellow.default.hex}}"
blue = "{{colors.primary.default.hex}}"
magenta = "{{colors.tertiary.default.hex}}"
cyan = "{{colors.secondary.default.hex}}"
<* if {{ is_dark_mode }} *>
black = "{{colors.surface_container_high.default.hex}}"
white = "{{colors.secondary_fixed_dim.default.hex}}"
<* else *>
black = "{{colors.on_primary_fixed.default.hex}}"
white = "{{colors.on_surface_variant.default.hex}}"
<* endif *>

[colors.bright]
black = "{{colors.outline.default.hex}}"
<* if {{ is_dark_mode }} *>
red = "{{colors.on_term_red_container.default.hex}}"
green = "{{colors.on_term_green_container.default.hex}}"
yellow = "{{colors.on_term_yellow_container.default.hex}}"
blue = "{{colors.tertiary_fixed.default.hex}}"
magenta = "{{colors.tertiary_fixed.default.hex}}"
cyan = "{{colors.secondary_fixed.default.hex}}"
white = "{{colors.primary_fixed.default.hex}}"
<* else *>
red = "{{colors.term_red.default.hex}}"
green = "{{colors.term_green.default.hex}}"
yellow = "{{colors.term_yellow.default.hex}}"
blue = "{{colors.on_primary_fixed_variant.default.hex}}"
magenta = "{{colors.on_tertiary_fixed_variant.default.hex}}"
cyan = "{{colors.on_secondary_fixed_variant.default.hex}}"
white = "{{colors.surface_container_lowest.default.hex}}"
<* endif *>
