# Generated by matugen from the wallpaper, do not edit by hand.
# Starship — Nord Pills layout (the user's pick #5), colors from the wallpaper.
# Nerd Font glyphs are written as \uXXXX escapes so they survive editing.
#    = left round cap    = right round cap
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[](fg:{{colors.primary.default.hex}})$os$username[](fg:{{colors.primary.default.hex}}) \
[](fg:{{colors.secondary.default.hex}})$directory[](fg:{{colors.secondary.default.hex}})\
$git_branch$git_status\
$rust$python$nodejs\
$cmd_duration \
[](fg:{{colors.surface_container_highest.default.hex}})$time[](fg:{{colors.surface_container_highest.default.hex}})
$character"""

[os]
disabled = false
style = "bold fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}}"
format = "[$symbol ]($style)"

[os.symbols]
Arch = ""
CachyOS = ""
Linux = ""

[username]
show_always = true
style_user = "bold fg:{{colors.on_primary.default.hex}} bg:{{colors.primary.default.hex}}"
style_root = "bold fg:{{colors.error.default.hex}} bg:{{colors.primary.default.hex}}"
format = "[$user]($style)"

[directory]
style = "bold fg:{{colors.on_secondary.default.hex}} bg:{{colors.secondary.default.hex}}"
format = "[ $path]($style)[$read_only]($read_only_style)"
read_only = " "
read_only_style = "fg:{{colors.error.default.hex}} bg:{{colors.secondary.default.hex}}"
truncation_length = 4
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
symbol = ""
style = "bold fg:{{colors.on_tertiary.default.hex}} bg:{{colors.tertiary.default.hex}}"
format = " [](fg:{{colors.tertiary.default.hex}})[$symbol $branch]($style)"

[git_status]
style = "bold fg:{{colors.on_tertiary.default.hex}} bg:{{colors.tertiary.default.hex}}"
format = "[( $all_status$ahead_behind)]($style)[](fg:{{colors.tertiary.default.hex}})"

[rust]
symbol = ""
style = "bold fg:{{colors.on_primary_fixed.default.hex}} bg:{{colors.term_cyan.default.hex}}"
format = " [](fg:{{colors.term_cyan.default.hex}})[$symbol $version]($style)[](fg:{{colors.term_cyan.default.hex}})"

[python]
symbol = ""
style = "bold fg:{{colors.on_primary_fixed.default.hex}} bg:{{colors.term_cyan.default.hex}}"
format = " [](fg:{{colors.term_cyan.default.hex}})[$symbol $version]($style)[](fg:{{colors.term_cyan.default.hex}})"

[nodejs]
symbol = ""
style = "bold fg:{{colors.on_primary_fixed.default.hex}} bg:{{colors.term_cyan.default.hex}}"
format = " [](fg:{{colors.term_cyan.default.hex}})[$symbol $version]($style)[](fg:{{colors.term_cyan.default.hex}})"

[cmd_duration]
min_time = 2000
style = "bold fg:{{colors.on_primary_fixed.default.hex}} bg:{{colors.term_yellow.default.hex}}"
format = " [](fg:{{colors.term_yellow.default.hex}})[ $duration]($style)[](fg:{{colors.term_yellow.default.hex}})"

[time]
disabled = false
time_format = "%H:%M"
style = "bold fg:{{colors.on_surface.default.hex}} bg:{{colors.surface_container_highest.default.hex}}"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold {{colors.primary.default.hex}})"
error_symbol = "[❯](bold {{colors.term_red.default.hex}})"
vimcmd_symbol = "[❮](bold {{colors.tertiary.default.hex}})"
