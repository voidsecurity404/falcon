[config]
version_check = false
fallback_color = "#8fc7ee"

[templates.shell]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.local/state/niri-desk/colors.json"

[templates.niri]
input_path = "~/.config/matugen/templates/niri.kdl"
output_path = "~/.config/niri/generated/colors.kdl"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/niri-desk-colors.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/niri-desk-colors.conf"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct.conf"
output_path = "~/.config/qt6ct/colors/niri-desk.conf"

[templates.firefox]
input_path = "~/.config/matugen/templates/firefox.css"
output_path = "~/.local/state/niri-desk/firefox-userChrome.css"
post_hook = "~/.local/bin/niri-desk-firefox"

[templates.sddm]
input_path = "~/.config/matugen/templates/sddm.conf"
output_path = "~/.local/state/niri-desk/sddm-colors.conf"
post_hook = "~/.local/bin/niri-desk-sddm-colors"
