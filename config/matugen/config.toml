[config]
version_check = false
fallback_color = "#8fc7ee"

# Terminal ANSI colors: fixed hues, harmonized toward the wallpaper.
[config.custom_colors]
term_red = { color = "#ff4d4d", blend = true }
term_green = { color = "#33cc66", blend = true }
term_yellow = { color = "#e6c200", blend = true }
term_blue = { color = "#3d8bff", blend = true }
term_magenta = { color = "#d65cd6", blend = true }
term_cyan = { color = "#22bbcc", blend = true }

[templates.shell]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.local/state/falcon/colors.json"

[templates.niri]
input_path = "~/.config/matugen/templates/niri.kdl"
output_path = "~/.config/niri/generated/colors.kdl"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/falcon-colors.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/falcon-colors.conf"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.local/state/falcon/gtk3-colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct.conf"
output_path = "~/.config/qt6ct/colors/falcon.conf"

[templates.firefox]
input_path = "~/.config/matugen/templates/firefox.css"
output_path = "~/.local/state/falcon/firefox-userChrome.css"
post_hook = "~/.local/bin/falcon-firefox"

[templates.sddm]
input_path = "~/.config/matugen/templates/sddm.conf"
output_path = "~/.local/state/falcon/sddm-colors.conf"
post_hook = "~/.local/bin/falcon-sddm-colors"

[templates.kde]
input_path = "~/.config/matugen/templates/kde.colors"
output_path = "~/.local/state/falcon/kde.colors"
post_hook = "~/.local/bin/falcon-app-colors kde"

[templates.vscode]
input_path = "~/.config/matugen/templates/vscode.json"
output_path = "~/.local/state/falcon/vscode-theme.json"
post_hook = "~/.local/bin/falcon-app-colors code"

[templates.mpv]
input_path = "~/.config/matugen/templates/mpv-colors.conf"
output_path = "~/.config/mpv/falcon-colors.conf"

[templates.mpvosc]
input_path = "~/.config/matugen/templates/mpv-osc.conf"
output_path = "~/.config/mpv/script-opts/osc.conf"

[templates.mpvconsole]
input_path = "~/.config/matugen/templates/mpv-console.conf"
output_path = "~/.config/mpv/script-opts/console.conf"

[templates.mpvmenu]
input_path = "~/.config/matugen/templates/mpv-menu.conf"
output_path = "~/.config/mpv/script-opts/context_menu.conf"

[templates.mpvuosc]
input_path = "~/.config/matugen/templates/mpv-uosc.conf"
output_path = "~/.config/mpv/script-opts/uosc.conf"

[templates.apps]
input_path = "~/.config/matugen/templates/apps.json"
output_path = "~/.local/state/falcon/apps.json"

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.config/alacritty/falcon-colors.toml"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/falcon-colors.rasi"
