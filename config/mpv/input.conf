# Falcon: mpv keys. mpv's own defaults stay; these add the same keys for the
# Russian layout (mpv reads the letter typed, not the physical key) and a few
# handier ones.

# Russian layout: the same physical keys as f, m, s, j, v, i, o, q, p, l.
а cycle fullscreen
ь cycle mute
ы screenshot
о cycle sub
м cycle sub-visibility
ш script-binding stats/display-stats
щ show-progress
й quit
Й quit-watch-later
з cycle pause
д ab-loop
б add speed -0.1
ю add speed 0.1

# Mouse: double click fullscreen (default), wheel changes volume, middle click
# pauses, right click opens the uosc menu.
MBTN_RIGHT script-binding uosc/menu
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5
MBTN_MID cycle pause

# Ctrl+arrows: longer jumps.
Ctrl+RIGHT seek 30
Ctrl+LEFT seek -30
