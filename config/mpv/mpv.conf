# Falcon: mpv. Colors of the OSD, controller and menus come from the
# wallpaper through matugen (falcon-colors.conf and script-opts/).

# Picture: the high quality preset, decoded on the GPU when it is safe.
profile=high-quality
vo=gpu-next
hwdec=vaapi,auto-safe
deband=no

# Window: fits the screen, the cursor hides on its own, the last frame stays.
autofit-larger=90%x90%
cursor-autohide=900
keep-open=yes
title=${media-title}

# Resume where a video was left, with the volume and subtitle choices.
save-position-on-quit=yes
watch-later-options-remove=fullscreen

# Sound: no louder than the system (Falcon's hearing protection).
volume=100
volume-max=100
alang=uz,uzb,ru,rus,en,eng
slang=uz,uzb,ru,rus,en,eng

# Subtitles: Geist, soft shadow instead of a hard black outline.
sub-auto=fuzzy
sub-font=Geist
sub-font-size=42
sub-bold=yes
sub-outline-size=1.6
sub-outline-color="#A0000000"
sub-shadow-offset=1.5
sub-shadow-color="#80000000"
sub-blur=0.3
sub-margin-y=56

# OSD text sits on a rounded glass box.
osd-font=Geist
osd-font-size=28
osd-bold=yes
osd-border-style=background-box
osd-margin-x=24
osd-margin-y=20
osd-duration=900
osd-bar-h=1.6
osd-bar-w=40
osd-bar-align-y=0.85
osd-bar-outline-size=0

# Screenshots (s) as PNG.
screenshot-format=png
screenshot-template=mpv-%F-%wHh%wMm%wSs

include=~~/falcon-colors.conf
