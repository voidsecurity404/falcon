source = ~/.config/hypr/falcon-colors.conf
source = ~/.config/hypr/falcon-lang.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.2, 0.9, 0.24, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 3, soft
    animation = inputFieldDots, 1, 2, soft
}

# The wallpaper already blurred and darkened by falcon-lock-bg, the same picture the shell's
# locking show (Mod+L) ends on, so hyprlock fades in over it without a seam. Places and sizes
# below are repeated in modules/LockIntro.qml: change both together.
background {
    monitor =
    path = ~/.local/state/falcon/lock-bg.jpg
    color = $pill
    blur_passes = 0
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 132
    font_family = Geist Light
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%d.%m.%Y"
    color = $text
    font_size = 19
    font_family = Geist
    position = 0, 66
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 0
    inner_color = $pill
    outer_color = $pill
    check_color = $accent
    fail_color = $error
    font_color = $text
    dots_size = 0.2
    dots_spacing = 0.4
    fade_on_empty = false
    rounding = 13
    font_family = Geist
    placeholder_text = $pw_placeholder
    fail_text = $pw_fail
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = $text
    font_size = 13
    font_family = Geist Mono
    position = 0, -92
    halign = center
    valign = center
}
